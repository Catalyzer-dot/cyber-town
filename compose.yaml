services:
  app:
    build:
      context: .
      target: runtime
    image: cyber-town:local
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  path-proxy:
    image: nginx:alpine
    profiles: [path-proxy]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PROXY_TEST_PORT:-3080}:80"
    volumes:
      - ./deploy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
