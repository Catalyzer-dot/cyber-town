services:
  app:
    build:
      context: .
      target: runtime
    image: cyber-town:local
    env_file:
      - path: .env
        required: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyber_town}:${POSTGRES_PASSWORD:-cyber_town_dev}@postgres:5432/${POSTGRES_DB:-cyber_town}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyber_town}
      POSTGRES_USER: ${POSTGRES_USER:-cyber_town}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyber_town_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cyber_town} -d ${POSTGRES_DB:-cyber_town}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  path-proxy:
    image: nginx:alpine
    profiles: [path-proxy]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${PROXY_TEST_PORT:-3080}:80'
    volumes:
      - ./deploy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
