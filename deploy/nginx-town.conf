# 将这一段加入 degenerates-backend/nginx.conf 的 HTTPS server 块中。
# cyber-town-app 和 degenerates-nginx 必须同时连接 cyber-town-proxy 网络。

location = /town {
    return 301 /town/;
}

location ^~ /town/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cyber_town_backend cyber-town-app;

    # 末尾斜杠会把 /town/api/... 转换为后端的 /api/...
    proxy_pass http://$cyber_town_backend:3000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /town;

    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
